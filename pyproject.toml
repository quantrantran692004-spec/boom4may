[project]
name = "amazon-android-tool"
version = "0.1.0"
description = "Real-device Android and Amazon Shopping setup controller"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9,<8", "pywinauto>=0.6.9,<0.7", "customtkinter>=5.2,<6", "playwright>=1.50,<2", "Pillow>=9", "rapidocr>=3.10,<4", "onnxruntime>=1.20,<1.21", "uiautomator2>=3.7.1,<4"]

[project.scripts]
amazon-android = "amazon_android.cli:main"
amazon-swarmote-desktop = "amazon_android.desktop:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["amazon_android*"]

[tool.setuptools.package-data]
amazon_android = ["assets/*.png", "assets/*.ico", "assets/icons/*.png", "assets/icons/*.svg", "assets/icons/LICENSE"]
